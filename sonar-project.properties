# Analisis unico (ambos microservicios) para SonarQube Cloud.
# El organization y el projectKey se pasan desde el workflow (variables del repositorio).
sonar.projectName=admin-proyectos-microservicios
sonar.sources=Ejercicio5MyAPIGestor/src/main/java,Ejercicio5Cliente/src/main/java
sonar.tests=Ejercicio5MyAPIGestor/src/test/java,Ejercicio5Cliente/src/test/java
sonar.java.binaries=Ejercicio5MyAPIGestor/target/classes,Ejercicio5Cliente/target/classes
sonar.java.libraries=**/.m2/repository/**/*.jar
sonar.coverage.jacoco.xmlReportPaths=Ejercicio5MyAPIGestor/target/site/jacoco/jacoco.xml,Ejercicio5Cliente/target/site/jacoco/jacoco.xml
sonar.coverage.exclusions=**/Ejercicio5MyApiGestorApplication.java,**/Ejercicio5ClienteApplication.java
sonar.exclusions=**/target/**,**/static/**,**/templates/**
