# Analisis unico (ambos microservicios) para SonarQube Cloud.
# El organization y el projectKey se pasan desde el workflow (variables del repositorio).
sonar.projectName=admin-proyectos-microservicios
sonar.java.binaries=Ejercicio5MyAPIGestor/target/classes,Ejercicio5Cliente/target/classes
sonar.coverage.jacoco.xmlReportPaths=Ejercicio5MyAPIGestor/target/site/jacoco/jacoco.xml,Ejercicio5Cliente/target/site/jacoco/jacoco.xml

# La cobertura se mide solo sobre el codigo de la aplicacion (Java).
# Se excluyen las clases main de arranque, los scripts de pruebas de carga (k6),
# los scripts de PowerShell, el JavaScript del navegador/pruebas y la infraestructura
# como codigo (Terraform, monitoreo), que no tiene pruebas unitarias por naturaleza.
sonar.coverage.exclusions=**/Ejercicio5MyApiGestorApplication.java,**/Ejercicio5ClienteApplication.java,k6/**,scripts/**,monitoring/**,terraform/**,**/*.js,**/pruebas-js/**

# No se analizan salidas de compilacion, recursos web, evidencias ni documentos de entrega.
sonar.exclusions=**/target/**,**/static/**,**/templates/**,entrega/**,evidencia/**,evidencia-antes/**,evidencia-u3/**,docs/**,temp_doc*/**,**/pruebas-js/**
