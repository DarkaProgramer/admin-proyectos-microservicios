spring.application.name=Ejercicio5MyAPIGestor
server.port=${PORT:8081}
spring.datasource.url=jdbc:mariadb://localhost:3306/dbgestor
spring.datasource.username=root
spring.datasource.password=
spring.datasource.dbcp2.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Monitoreo (Unidad III): Actuator + Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
