global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gestor-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8081']
  - job_name: gestor-frontend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['frontend:9080']
