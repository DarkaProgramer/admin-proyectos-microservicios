groups:
  - name: gestor
    rules:
      - alert: ServicioCaido
        expr: up{job=~"gestor-.*"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "El servicio {{ $labels.job }} no responde"
      - alert: LatenciaP95Alta
        expr: histogram_quantile(0.95, sum by (le, job) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[1m]))) > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "p95 mayor a 1 s en {{ $labels.job }}"
      - alert: ErroresServidor5xx
        expr: sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[1m])) > 0.1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Errores 5xx en {{ $labels.job }}"
