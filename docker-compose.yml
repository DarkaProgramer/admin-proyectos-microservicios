# Despliegue completo: MariaDB + backend (8081) + frontend (9080)
# Uso:  docker compose up --build
services:
  db:
    image: mariadb:11.3
    container_name: gestor-db
    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: dbgestor
    volumes:
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro   # carga el dump al primer arranque
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build: ./Ejercicio5MyAPIGestor
    image: gestor-backend:1.0
    container_name: gestor-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/dbgestor
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      JAVA_OPTS: "-Xmx256m"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"

  frontend:
    build: ./Ejercicio5Cliente
    image: gestor-frontend:1.0
    container_name: gestor-frontend
    environment:
      BACKEND_URL: http://backend:8081
      JAVA_OPTS: "-Xmx256m"
    depends_on:
      - backend
    ports:
      - "9080:9080"

  # ---------- Unidad III: monitoreo ----------
  prometheus:
    image: prom/prometheus:latest
    container_name: gestor-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - backend
      - frontend
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: gestor-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "3000:3000"

  # ---------- Unidad III: prueba de carga (solo con --profile load) ----------
  k6:
    image: grafana/k6:latest
    container_name: gestor-k6
    profiles: ["load"]
    depends_on:
      - backend
      - frontend
    environment:
      FRONT_URL: http://frontend:9080
      BACK_URL: http://backend:8081
    volumes:
      - ./k6:/scripts:ro
      - ./evidencia-u3:/results
    command: run /scripts/prueba-carga.js --summary-export=/results/k6-resumen.json

volumes:
  db-data:
